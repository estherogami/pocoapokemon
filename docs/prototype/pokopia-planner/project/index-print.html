<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Pokopia · Planner — Print</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    @page { size: A4 portrait; margin: 0.5cm; }
    html, body { margin: 0; padding: 0; background: #f0eee9; font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .print-doc { display: flex; flex-direction: column; gap: 20px; align-items: center; padding: 16px; }
    .print-page {
      background: #fff;
      padding: 14px 14px 18px;
      border-radius: 6px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.10);
      break-inside: avoid;
      page-break-inside: avoid;
      break-after: page;
      page-break-after: always;
    }
    .print-page:last-child { break-after: auto; page-break-after: auto; }
    .print-label {
      font-size: 11px; font-weight: 900; letter-spacing: 1.4px; text-transform: uppercase;
      color: #A17458; margin-bottom: 8px; font-family: "Noto Sans JP", sans-serif;
    }
    .print-frame {
      position: relative; overflow: hidden;
    }
    .print-artboard {
      transform-origin: top left;
      position: absolute; top: 0; left: 0;
    }

    @media print {
      html, body { background: #fff; }
      .print-doc { gap: 0; padding: 0; }
      .print-page {
        box-shadow: none; border-radius: 0;
        padding: 0;
        background: transparent;
      }
      .print-label { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- minimal stubs so design-canvas.jsx is not needed -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="common.jsx"></script>
  <script type="text/babel" src="v1-libreta.jsx"></script>
